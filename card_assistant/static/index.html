<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Черновик карточки товара КИП</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #1f5fbf; --accent-soft: #e8f0fc; --ok: #1d7a46; --ok-soft: #e6f4ec;
    --warn: #a15c00; --warn-soft: #fdf2e1; --bad: #b42318; --bad-soft: #fdecea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); }
  header { padding: 20px 28px 8px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  main { display: grid; grid-template-columns: minmax(340px, 5fr) 7fr; gap: 20px; padding: 16px 28px 32px; align-items: start; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 8px 12px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  label small { font-weight: 400; color: var(--muted); }
  input, textarea, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); }
  textarea { resize: vertical; }
  #json { font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; min-height: 440px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .primary { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .hidden { display: none !important; }
  .placeholder { color: var(--muted); text-align: center; padding: 60px 20px; }
  .status { display: inline-block; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
  .status.ok { background: var(--ok-soft); color: var(--ok); }
  .status.needs_review { background: var(--warn-soft); color: var(--warn); }
  .status.insufficient_data, .error { background: var(--bad-soft); color: var(--bad); }
  .error { border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }
  section { border-top: 1px solid var(--line); padding: 14px 0 4px; }
  section:first-of-type { border-top: 0; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .head h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .count { font-size: 12px; color: var(--muted); margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .count.bad { color: var(--bad); font-weight: 600; }
  .title { font-size: 18px; font-weight: 600; }
  .desc { white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.src { color: var(--muted); font-size: 12px; white-space: nowrap; }
  tr.missing td { color: var(--muted); font-style: italic; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cols h4 { margin: 0 0 2px; font-size: 13px; }
  .warn li { color: var(--warn); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Черновик карточки товара КИП</h1>
  <p>Введите данные о приборе — сервис подготовит SEO-заголовок, описание, характеристики, поисковые запросы и блок для менеджера. Значения берутся только из введённых данных.</p>
</header>
<main>
  <div class="panel">
    <div class="tabs">
      <button data-tab="form" class="active">Форма</button>
      <button data-tab="json">JSON</button>
    </div>
    <label for="example">Подставить пример</label>
    <select id="example"><option value="">— выберите —</option></select>

    <div id="pane-form">
      <label for="name">Название товара *</label>
      <input id="name" placeholder="Манометр показывающий DM 02">
      <label for="manufacturer">Производитель</label>
      <input id="manufacturer" placeholder="Манотомь">
      <label for="specs">Характеристики <small>— по одной на строку: «название: значение»</small></label>
      <textarea id="specs" rows="9" placeholder="Диапазон измерений: 0–1,6 МПа&#10;Класс точности: 1,5&#10;Присоединение: G1/2"></textarea>
      <label for="description">Описание или фрагмент паспорта</label>
      <textarea id="description" rows="8"></textarea>
    </div>
    <div id="pane-json" class="hidden">
      <label for="json">JSON <small>— поля name, manufacturer, specs, description</small></label>
      <textarea id="json" spellcheck="false">{
  "name": "",
  "manufacturer": "",
  "specs": {},
  "description": ""
}</textarea>
    </div>
    <div class="row">
      <button id="submit" class="primary">Сгенерировать</button>
      <span id="hint" class="count"></span>
    </div>
  </div>

  <div class="panel" id="result"><div class="placeholder">Здесь появится черновик карточки.</div></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const STATUS = {
  ok: "Черновик готов к вычитке",
  needs_review: "Требует внимания — см. автопроверку",
  insufficient_data: "Мало исходных данных — см. «Что уточнить»",
};
const SOURCE = { specs: "характеристики", name: "название", description: "описание", missing: "—" };
let mode = "form", examples = [], last = null;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.flat().filter((c) => c !== null && c !== undefined));
  return node;
}

function setMode(next) {
  mode = next;
  document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === next));
  $("#pane-form").classList.toggle("hidden", next !== "form");
  $("#pane-json").classList.toggle("hidden", next !== "json");
}
document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => setMode(b.dataset.tab)));

function specsToText(specs, prefix = "") {
  if (!specs || typeof specs !== "object") return typeof specs === "string" ? specs : "";
  return Object.entries(specs).map(([k, v]) =>
    v && typeof v === "object" && !Array.isArray(v) ? specsToText(v, `${prefix}${k} — `) : `${prefix}${k}: ${v ?? ""}`
  ).join("\n");
}

fetch("/api/examples").then((r) => r.json()).then((list) => {
  examples = list;
  list.forEach((e) => {
    let label;
    try { label = JSON.parse(e.text).name || e.id; } catch { label = `${e.id} (битый JSON)`; }
    $("#example").append(el("option", { value: e.id, textContent: label }));
  });
});

$("#example").onchange = (event) => {
  const example = examples.find((e) => e.id === event.target.value);
  if (!example) return;
  $("#json").value = example.text;
  try {
    const data = JSON.parse(example.text);
    $("#name").value = data.name || "";
    $("#manufacturer").value = data.manufacturer || "";
    $("#specs").value = specsToText(data.specs);
    $("#description").value = data.description || "";
  } catch {
    setMode("json"); // битый пример можно посмотреть только как JSON
  }
};

$("#submit").onclick = async () => {
  const body = mode === "json" ? $("#json").value : JSON.stringify({
    name: $("#name").value, manufacturer: $("#manufacturer").value,
    specs: $("#specs").value, description: $("#description").value,
  });
  $("#submit").disabled = true;
  $("#result").replaceChildren(el("div", { className: "placeholder" }, el("div", { className: "spinner" }), "Генерация и проверка черновика… обычно 10–60 секунд"));
  try {
    const response = await fetch("/api/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body });
    const data = await response.json().catch(() => ({ error: `Сервер ответил ${response.status} без пояснений.` }));
    if (!response.ok) throw new Error(data.error || `Ошибка ${response.status}`);
    last = data;
    renderCard(data.card);
  } catch (error) {
    $("#result").replaceChildren(el("div", { className: "error", textContent: error.message.startsWith("Failed to fetch") ? "Сервер недоступен." : error.message }));
  } finally {
    $("#submit").disabled = false;
  }
};

function copyButton(getText, label = "Копировать") {
  const button = el("button", { className: "ghost", textContent: label });
  button.onclick = async () => {
    await navigator.clipboard.writeText(getText());
    button.textContent = "Скопировано";
    setTimeout(() => (button.textContent = label), 1200);
  };
  return button;
}

function block(title, count, action, ...content) {
  return el("section", {}, el("div", { className: "head" }, el("h3", {}, title, count), action), ...content);
}

function counter(text, ok) {
  return el("span", { className: `count${ok ? "" : " bad"}`, textContent: text });
}

function list(items, className = "") {
  return items.length ? el("ul", { className }, items.map((i) => el("li", { textContent: i }))) : el("p", { className: "count", textContent: "нет" });
}

function renderCard(card) {
  const titleLen = card.seo_title.length, descLen = card.seo_description.length;
  $("#result").replaceChildren(
    el("div", { className: "head" },
      el("span", { className: `status ${card.status}`, textContent: STATUS[card.status] }),
      el("span", {}, copyButton(() => last.markdown, "Markdown"), " ", copyButton(() => JSON.stringify(last.card, null, 2), "JSON"))),
    block("SEO-заголовок", counter(`${titleLen}/70`, titleLen <= 70), copyButton(() => card.seo_title),
      el("div", { className: "title", textContent: card.seo_title })),
    block("SEO-описание", counter(`${descLen} симв.`, descLen >= 800 && descLen <= 1200), copyButton(() => card.seo_description),
      el("div", { className: "desc", textContent: card.seo_description })),
    block("Ключевые характеристики", null, null,
      el("table", {}, el("tr", {}, el("th", { textContent: "Характеристика" }), el("th", { textContent: "Значение" }), el("th", { textContent: "Источник" })),
        card.key_specs.map((s) => el("tr", { className: s.source === "missing" ? "missing" : "" },
          el("td", { textContent: s.name }), el("td", { textContent: s.value }), el("td", { className: "src", textContent: SOURCE[s.source] }))))),
    block("Поисковые запросы", null, copyButton(() => card.search_queries.join("\n")),
      el("div", { className: "chips" }, card.search_queries.map((q) => el("span", { className: "chip", textContent: q })))),
    block("Для менеджера", null, null,
      el("div", { className: "cols" },
        el("div", {}, el("h4", { textContent: "Кому подходит" }), list(card.commercial.audience)),
        el("div", {}, el("h4", { textContent: "Какие задачи решает" }), list(card.commercial.tasks)))),
    block("Что уточнить", null, null, list(card.clarifications)),
    block("Автоматическая проверка", null, null, card.warnings.length ? list(card.warnings, "warn") : el("p", { className: "count", textContent: "замечаний нет" })),
    el("div", { className: "meta", textContent: `Модель: ${card.meta.model} · попыток: ${card.meta.attempts}` }),
  );
}
</script>
</body>
</html>
